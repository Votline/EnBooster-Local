apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50053
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: ai-config
            - secretRef:
                name: shared-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - port: 50053
      targetPort: 50053
      name: grpc
