apiVersion: apps/v1
kind: Deployment
metadata:
  name: learn-service
  labels:
    app: learn-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learn-service
  template:
    metadata:
      labels:
        app: learn-service
    spec:
      containers:
        - name: learn-service
          image: learn-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: learn-config
            - secretRef:
                name: shared-secret
---
apiVersion: v1
kind: Service
metadata:
  name: learn-service
spec:
  type: ClusterIP
  selector:
    app: learn-service
  ports:
    - port: 50052
      targetPort: 50052
      name: grpc
