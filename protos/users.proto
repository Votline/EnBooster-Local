syntax = "proto3";

package users;
option go_package="generated-users/;usersservice";

message RegReq {
  int64 uuid = 1;
  int64 chat_id = 2;
  string request_trace = 3;
}
message RegRes {}

message GetReq {
  int64 uuid = 1;
  string request_trace = 2;
}
message GetRes {
  string data = 1; // json
}

message UpdSystemPromptReq {
  int64  uuid = 1;
  string system_prompt = 2;
  string request_trace = 3;
}
message UpdSystemPromptRes {}

message UpdLangLevelReq {
  int64  uuid = 1;
  string level = 2;
  string request_trace = 3;
}
message UpdLangLevelRes {}

message DelReq {
  int64 uuid = 1;
  string request_trace = 2;
}
message DelRes {}

service UsersService {
  rpc RegUser (RegReq) returns (RegRes);
  rpc GetUser (GetReq) returns (GetRes);
  rpc UpdSystemPrompt (UpdSystemPromptReq) returns (UpdSystemPromptRes);
  rpc UpdLangLevel (UpdLangLevelReq) returns (UpdLangLevelRes);
  rpc DelUser (DelReq) returns (DelRes);
}
