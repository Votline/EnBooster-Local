syntax = "proto3";

package ai;
option go_package = "generated-ai/;aiservice";

message GenerateTextReq {
  int64 uuid = 1;
  string prompt = 2;
  string system_prompt = 3;
  string request_trace = 4;
}
message GenerateTextRes {
  string text = 1;
}

message GenerateAudioReq {
  int64 uuid = 1;
  string text = 2;
  string request_trace = 3;
}
message GenerateAudioRes {
  bytes audio_data = 1;
}

message RecognizeAudioReq {
  int64 uuid = 1;
  bytes audio_data = 2;
  string request_trace = 3;
}
message RecognizeAudioRes {
  string text = 1;
}

message ClearAIContextReq {
  int64 uuid = 1;
  string request_trace = 2;
}
message ClearAIContextRes {
}

service AIService {
  rpc GenerateText (GenerateTextReq) returns (stream GenerateTextRes);
  rpc GenerateAudio (GenerateAudioReq) returns (GenerateAudioRes);
  rpc RecognizeAudio (RecognizeAudioReq) returns (stream RecognizeAudioRes);
  rpc ClearAIContext (ClearAIContextReq) returns (ClearAIContextRes);
}
