services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    env_file:
      - .env
      - ./gateway/.env_vars
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      redis_sm:
        condition: service_healthy
      users-service:
        condition: service_started
      learn-service:
        condition: service_started
      ai-service:
        condition: service_started

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile
    env_file:
      - .env
      - ./users-service/.env_vars
    ports:
      - "${USERS_PORT}:${USERS_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  learn-service:
    build:
      context: .
      dockerfile: learn-service/Dockerfile
    env_file:
      - .env
      - ./learn-service/.env_vars
    ports:
      - "${LEARN_PORT}:${LEARN_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis_lrn:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    env_file:
      - .env
      - ./ai-service/.env_vars
    ports:
      - "${AISRV_PORT}:${AISRV_PORT}"
    depends_on:
      redis_ai:
        condition: service_healthy

  postgres:
    image: postgres:17
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    env_file:
      - .env
    volumes:
      - ./users-service/init.sql:/docker-entrypoint-initdb.d/1-users.sql:ro
      - ./learn-service/init.sql:/docker-entrypoint-initdb.d/2-learn.sql:ro
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1 FROM users LIMIT 1;'"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 5s

  redis_sm:
    image: redis:alpine
    ports:
      - "${REDIS_SM_PORT}:${REDIS_PORT}"
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_SM_PASSWORD}"
      - "--loglevel warning"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SM_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis_lrn:
    image: redis:alpine
    ports:
      - "${REDIS_LRN_PORT}:${REDIS_PORT}"
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_LRN_PASSWORD}"
      - "--loglevel warning"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SM_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis_rl:
    image: redis:alpine
    ports:
      - "${REDIS_RL_PORT}:${REDIS_PORT}"
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_RL_PASSWORD}"
      - "--loglevel warning"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SM_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis_ai:
    image: redis:alpine
    ports:
      - "${REDIS_AI_PORT}:${REDIS_PORT}"
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_AI_PASSWORD}"
      - "--loglevel warning"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SM_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/${KAFKA_PORT}'"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ALLOW_AUTO_CREATE_TOPICS: "true"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "${KAFKA_VOTERS}"

      KAFKA_LISTENERS: "${KAFKA_LIS_1},${KAFKA_LIS_2}"
      KAFKA_ADVERTISED_LISTENERS: "${KAFKA_ADV}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

      KAFKA_CLUSTER_ID: "${KAFKA_CLUSTER_ID}"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - /opt/ollama/models:/root/.ollama/models
    ports:
      - "${OLLAMA_PORT_OUT}:${OLLAMA_PORT}"

volumes:
  pgdata:
