services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    env_file:
      - .env
      - ./gateway/.env_vars
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      redis_sm:
        condition: service_healthy
      users-service:
        condition: service_started
      learn-service:
        condition: service_started
      ai-service:
        condition: service_started
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile
    env_file:
      - .env
      - ./users-service/.env_vars
    ports:
      - "${USERS_PORT}:${USERS_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  learn-service:
    build:
      context: .
      dockerfile: learn-service/Dockerfile
    env_file:
      - .env
      - ./learn-service/.env_vars
    ports:
      - "${LEARN_PORT}:${LEARN_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis_lrn:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    env_file:
      - .env
      - ./ai-service/.env_vars
    ports:
      - "${AISRV_PORT}:${AISRV_PORT}"
    depends_on:
      redis_ai:
        condition: service_healthy

  postgres:
    image: postgres:17
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    env_file:
      - .env
    volumes:
      - ./users-service/init.sql:/docker-entrypoint-initdb.d/1-users.sql:ro
      - ./learn-service/init.sql:/docker-entrypoint-initdb.d/2-learn.sql:ro
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1 FROM users LIMIT 1;'"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 5s

  redis_sm:
    image: redis:alpine
    ports:
      - "${REDIS_SM_PORT}:${REDIS_PORT}"
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_SM_PASSWORD}"
      - "--loglevel warning"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SM_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis_lrn:
    image: redis:alpine
    ports:
      - "${REDIS_LRN_PORT}:${REDIS_PORT}"
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_LRN_PASSWORD}"
      - "--loglevel warning"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SM_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis_rl:
    image: redis:alpine
    ports:
      - "${REDIS_RL_PORT}:${REDIS_PORT}"
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_RL_PASSWORD}"
      - "--loglevel warning"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SM_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis_ai:
    image: redis:alpine
    ports:
      - "${REDIS_AI_PORT}:${REDIS_PORT}"
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_AI_PASSWORD}"
      - "--loglevel warning"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SM_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
